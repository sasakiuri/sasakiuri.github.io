packages:
  - "."
  - "tools/*"

autoInstallPeers: true
blockExoticSubdeps: true
disallowWorkspaceCycles: true
engineStrict: true
minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
saveExact: true
strictDepBuilds: true
strictPeerDependencies: true
trustLockfile: false
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600
update:
  githubActions: true
verifyDepsBeforeRun: error

# Storybook's config loader works with TypeScript 7, but its published peer range
# has not caught up. Keep the exception scoped to the exact dependent.
peerDependencyRules:
  allowedVersions:
    "tsconfck@3>typescript": "7"

# These analysis tools load TypeScript without declaring it. Model the runtime
# contract as a peer so each compatibility workspace's TypeScript 5 is used.
packageExtensions:
  "@stryker-mutator/core@10.0.0":
    peerDependencies:
      typescript: ">=2.0.0 <7.0.0"
  "dependency-cruiser@18.2.0":
    peerDependencies:
      typescript: ">=2.0.0 <7.0.0"

overrides:
  "typed-rest-client>qs": "6.16.0"

allowBuilds:
  esbuild: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: true
