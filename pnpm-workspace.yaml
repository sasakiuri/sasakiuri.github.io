packages:
  - "."
  - "tools/*"

autoInstallPeers: true
blockExoticSubdeps: true
disallowWorkspaceCycles: true
engineStrict: true
minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
saveExact: true
strictDepBuilds: true
strictPeerDependencies: true
trustLockfile: false
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600
update:
  githubActions: true
verifyDepsBeforeRun: error

# Storybook's config loader works with TypeScript 7, outside its declared peer range.
# Apply the exception to tsconfck only.
peerDependencyRules:
  allowedVersions:
    "tsconfck@3>typescript": "7"

# These tools load TypeScript without declaring it.
# Add a peer dependency so they use TypeScript 5 from their workspace.
packageExtensions:
  "@stryker-mutator/core@10.0.0":
    peerDependencies:
      typescript: ">=2.0.0 <7.0.0"
  "dependency-cruiser@18.6.0":
    peerDependencies:
      typescript: ">=2.0.0 <7.0.0"

overrides:
  "typed-rest-client>qs": "6.16.0"
  "serve>compression": "1.8.2"
  # Replace the vulnerable Vite version reused by automatically installed peers.
  "vite@8.2.2": "8.2.4"

allowBuilds:
  esbuild: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: true
