  - coverage/**
  - "**/node_modules/**"
  - out/**
  - playwright-report/**
  - pnpm-lock.yaml
  - public/**/*.{ico,webp}
  - reports/**
  - src/content/diary.json
  - src/app/fonts/**
  - storybook-static/**
  - stryker/**
  - test-results/**
