name: Verify and deploy

on:
  push:
    branches: [1.x]
  pull_request:
    branches: [1.x]
  merge_group:
  repository_dispatch:
    types: [diary-updated, dependabot-updated]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static, unit, and supply-chain checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-name: static-export-${{ github.run_attempt }}
      sbom-sha256: ${{ steps.artifact-seal.outputs.sbom-sha256 }}
      seal-sha256: ${{ steps.artifact-seal.outputs.seal-sha256 }}
      tree-sha256: ${{ steps.artifact-seal.outputs.tree-sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            tools/architecture/pnpm-lock.yaml
            tools/mutation/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static and unit checks
        run: pnpm check

      - name: Build the static export
        run: pnpm build

      - name: Generate and validate the file-level SPDX SBOM
        run: |
          source_date_epoch="$(git log -1 --format=%ct)"
          node scripts/generate-static-sbom.mjs \
            --manifest reports/artifact/static-export-manifest.json \
            --output reports/attestation/static-export.spdx.json \
            --source-date-epoch "$source_date_epoch"
          pipx run --spec spdx-tools==0.8.5 pyspdxtools \
            -i reports/attestation/static-export.spdx.json

      - name: Export artifact checksums
        id: artifact-seal
        run: |
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync("reports/artifact/static-export-manifest.json", "utf8"));
          for (const name of ["sealSha256", "treeSha256"]) {
            if (typeof manifest[name] !== "string" || !/^[a-f0-9]{64}$/.test(manifest[name])) {
              throw new TypeError(`Artifact ${name} is not a lowercase SHA-256 digest.`);
            }
          }
          const sbomSha256 = crypto
            .createHash("sha256")
            .update(fs.readFileSync("reports/attestation/static-export.spdx.json"))
            .digest("hex");
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `sbom-sha256=${sbomSha256}\nseal-sha256=${manifest.sealSha256}\ntree-sha256=${manifest.treeSha256}\n`,
          );
          NODE

      - name: Enforce browser payload budget
        run: pnpm size

      - name: Audit dependencies
        run: pnpm deps:audit

      - name: Upload verified static export
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-export-${{ github.run_attempt }}
          path: |
            out/
            reports/artifact/static-export-manifest.json
            reports/attestation/static-export.spdx.json
          include-hidden-files: true
          retention-days: 7

      - name: Collect dependency licenses
        run: pnpm license:report

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports-${{ github.run_attempt }}
          path: |
            coverage/
            reports/
          if-no-files-found: ignore
          retention-days: 30

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  components:
    name: Storybook component checks
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            tools/architecture/pnpm-lock.yaml
            tools/mutation/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Storybook interaction and accessibility tests
        run: pnpm test:storybook

      - name: Build Storybook
        run: pnpm storybook:build

      - name: Upload Storybook
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-${{ github.run_attempt }}
          path: |
            storybook-static/
            reports/storybook-junit.xml
          if-no-files-found: ignore
          retention-days: 14

  browser:
    name: ${{ matrix.project }} browser checks
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            tools/architecture/pnpm-lock.yaml
            tools/mutation/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified static export
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.quality.outputs.artifact-name }}
          path: .

      - name: Verify the downloaded static export
        run: pnpm artifact:verify --seal-sha "$TRUSTED_SEAL_SHA"
        env:
          TRUSTED_SEAL_SHA: ${{ needs.quality.outputs.seal-sha256 }}

      - name: Install browser engine
        run: pnpm exec playwright install --with-deps ${{ matrix.project }}

      - name: Run browser checks
        run: pnpm exec playwright test --project=${{ matrix.project }}
        env:
          PLAYWRIGHT_REUSE_BUILD: "true"

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-reports-${{ matrix.project }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  performance:
    name: Lighthouse budgets
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            tools/architecture/pnpm-lock.yaml
            tools/mutation/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified static export
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.quality.outputs.artifact-name }}
          path: .

      - name: Verify the downloaded static export
        run: pnpm artifact:verify --seal-sha "$TRUSTED_SEAL_SHA"
        env:
          TRUSTED_SEAL_SHA: ${{ needs.quality.outputs.seal-sha256 }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Lighthouse three times and enforce medians
        run: pnpm lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports-${{ github.run_attempt }}
          path: reports/lighthouse/
          if-no-files-found: ignore
          retention-days: 30

  workflow-lint:
    name: GitHub Actions lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        run: >-
          docker run --rm --volume "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  deploy:
    name: Deploy GitHub Pages
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name ==
      'repository_dispatch'
    needs: [browser, components, performance, quality, workflow-lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Download verified static export
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.quality.outputs.artifact-name }}
          path: .

      - name: Verify deployment artifact integrity
        run: >-
          node scripts/verify-static-export.mjs --verify reports/artifact/static-export-manifest.json --seal-sha
          "$TRUSTED_SEAL_SHA"
        env:
          TRUSTED_SEAL_SHA: ${{ needs.quality.outputs.seal-sha256 }}

      - name: Create a reproducible archive for attestation
        run: |
          mkdir -p reports/attestation
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner --format=posix \
            --pax-option=delete=atime,delete=ctime \
            -cf reports/attestation/site-export.tar -C out .
          gzip --no-name --force reports/attestation/site-export.tar

      - name: Verify the SPDX SBOM checksum
        run: |
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const expected = process.env.TRUSTED_SBOM_SHA;
          if (typeof expected !== "string" || !/^[a-f0-9]{64}$/.test(expected)) {
            throw new TypeError("Trusted SPDX SHA-256 is invalid.");
          }
          const actual = crypto
            .createHash("sha256")
            .update(fs.readFileSync("reports/attestation/static-export.spdx.json"))
            .digest("hex");
          if (actual !== expected) throw new TypeError("The SPDX SBOM changed after validation.");
          NODE
        env:
          TRUSTED_SBOM_SHA: ${{ needs.quality.outputs.sbom-sha256 }}

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: reports/attestation/site-export.tar.gz

      - name: Attest the software bill of materials
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: reports/attestation/site-export.tar.gz
          sbom-path: reports/attestation/static-export.spdx.json

      - name: Upload the archive and SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-${{ github.run_attempt }}
          path: |
            reports/artifact/static-export-manifest.json
            reports/attestation/
          retention-days: 90

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          include-hidden-files: true
          path: out

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Verify the production deployment
        run: node scripts/monitor-production.mjs
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}

      - name: Upload deployment check results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: post-deployment-monitoring-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/monitoring/
          if-no-files-found: ignore
          retention-days: 90
