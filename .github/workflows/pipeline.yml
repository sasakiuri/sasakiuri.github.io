name: Verify and deploy

on:
  push:
    branches: [1.x]
  pull_request:
    branches: [1.x]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static, unit, and supply-chain checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static and unit checks
        run: pnpm check

      - name: Build the static export
        run: pnpm build

      - name: Enforce browser payload budget
        run: pnpm size

      - name: Audit dependencies
        run: pnpm deps:audit

      - name: Upload verified static export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-export
          path: out/
          include-hidden-files: true
          retention-days: 7

      - name: Collect dependency licenses
        run: pnpm license:report

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-reports
          path: |
            coverage/
            reports/
          if-no-files-found: ignore
          retention-days: 30

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          allow-ghsas: GHSA-5p2g-fcmc-qvqq, GHSA-w3rx-r6r6-pgpr

  components:
    name: Storybook component checks
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Storybook interaction and accessibility tests
        run: pnpm test:storybook

      - name: Build Storybook
        run: pnpm storybook:build

      - name: Upload Storybook
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook
          path: |
            storybook-static/
            reports/storybook-junit.xml
          if-no-files-found: ignore
          retention-days: 14

  browser:
    name: ${{ matrix.project }} browser checks
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified static export
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: static-export
          path: out

      - name: Verify promoted artifact integrity
        run: pnpm artifact:verify

      - name: Install browser engine
        run: pnpm exec playwright install --with-deps ${{ matrix.project }}

      - name: Run browser checks
        run: pnpm exec playwright test --project=${{ matrix.project }}
        env:
          PLAYWRIGHT_REUSE_BUILD: "true"

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-reports-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  performance:
    name: Lighthouse budgets
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified static export
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: static-export
          path: out

      - name: Verify promoted artifact integrity
        run: pnpm artifact:verify

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Lighthouse three times and enforce medians
        run: pnpm lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: reports/lighthouse/
          if-no-files-found: ignore
          retention-days: 30

  workflow-lint:
    name: GitHub Actions lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        run: >-
          docker run --rm --volume "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [browser, components, performance, workflow-lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Download verified static export
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: static-export
          path: out

      - name: Verify deployment artifact integrity
        run: node scripts/verify-static-export.mjs

      - name: Create deterministic attestation subject
        run: |
          mkdir -p reports/attestation
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner --format=posix \
            --pax-option=delete=atime,delete=ctime \
            -cf reports/attestation/site-export.tar -C out .
          gzip --no-name --force reports/attestation/site-export.tar

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          artifact-name: static-export-sbom.spdx.json
          format: spdx-json
          output-file: reports/attestation/static-export.spdx.json
          path: out
          upload-artifact-retention: 90

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: reports/attestation/site-export.tar.gz

      - name: Attest the software bill of materials
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: reports/attestation/site-export.tar.gz
          sbom-path: reports/attestation/static-export.spdx.json

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: |
            reports/artifact/static-export-manifest.json
            reports/attestation/
          retention-days: 90

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify the production deployment
        run: node scripts/monitor-production.mjs
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}

      - name: Upload post-deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-deployment-monitoring-${{ github.run_id }}
          path: reports/monitoring/
          if-no-files-found: ignore
          retention-days: 90
