name: PR title

on:
  pull_request:
    types: [edited, opened, synchronize]

permissions:
  pull-requests: read

jobs:
  validate:
    name: Conventional title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: true
          scopes: |
            ci
            deps
            docs
            repo
            site
            tooling
          subjectPattern: ^.+$
          subjectPatternError: PR title subject must not be empty
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
