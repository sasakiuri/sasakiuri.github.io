name: 不具合の報告
description: 現象と再現手順を報告してください。
body:
  - type: textarea
    attributes:
      label: 現象
      description: 実際の動作と期待する動作を書いてください。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 再現手順
      description: URL、ブラウザー、操作手順を書いてください。
    validations:
      required: true
  - type: dropdown
    attributes:
      label: 環境
      options:
        - PC（Chromium）
        - PC（Safari）
        - モバイル（Safari）
        - モバイル（Chromium）
        - その他
    validations:
      required: true
  - type: textarea
    attributes:
      label: 追加情報
      description: 画面キャプチャ、ログ、修正案があれば添付してください。
