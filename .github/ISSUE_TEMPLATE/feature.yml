name: 改善の提案
description: 解決したい課題と改善案を書いてください。
body:
  - type: textarea
    attributes:
      label: 課題
      description: 解決したい課題や利用場面を書いてください。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 提案
      description: 期待する動作と、現在のデザインへの影響を書いてください。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 代替案
      description: 検討した別の方法があれば書いてください。
