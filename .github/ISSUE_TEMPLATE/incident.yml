name: 障害の振り返り
description: 復旧した運用障害の経緯と、再発防止策の進捗を記録します。
labels: [incident]
body:
  - type: dropdown
    attributes:
      label: 重大度
      options:
        - SEV-1
        - SEV-2
        - SEV-3
    validations:
      required: true
  - type: input
    attributes:
      label: 影響時間
      description: 開始と復旧の時刻をタイムゾーン付きで書いてください。
      placeholder: 2026-08-25 10:00 JST - 10:20 JST
    validations:
      required: true
  - type: textarea
    attributes:
      label: 影響
      description: 利用者への影響、対象機能、検知経路を書いてください。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 経緯
      description: 検知、調査、緩和、復旧の主な出来事を時系列で書いてください。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 根本原因
      description: 個人の責任ではなく、障害が起きた技術上・運用上の条件を書いてください。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 改善策
      description: 担当、期限、検証方法を含む再発防止策を書いてください。
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: セキュリティ
      options:
        - label: 非公開で扱うべき脆弱性情報を含んでいないことを確認しました。
          required: true
